[package]
name = "mcp-toolkit"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Shared machinery for standalone MCP tool servers: CLI, transports, single-tool mode and timeouts on top of the official rmcp SDK"
license = "Unlicense"
repository = "https://github.com/Bluscream/mcp-toolkit"
readme = "README.md"
keywords = ["mcp", "llm", "tools", "rmcp"]
categories = ["development-tools"]

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive", "env"] }
memchr = "2.8.3"
rmcp = { version = "3.2.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
